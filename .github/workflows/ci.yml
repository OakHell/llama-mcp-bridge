name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v5

      - name: Sync UV
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest -v

      - name: Run llama-mcp-install dry-run
        run: uv run llama-mcp-install --dry-run

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y python311 uv rust py311-maturin \
              py311-pydantic-core py311-cryptography py311-rpds-py \
              py311-pyyaml py311-cffi py311-pytest py311-requests \
              py311-rich py311-pathspec
          run: |
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            uv venv --python python3.11 --system-site-packages
            uv pip install --no-build-isolation -e .
            uv run pytest -v
            uv run llama-mcp-install --dry-run
            uv run llama-mcp-install --install-service --dry-run

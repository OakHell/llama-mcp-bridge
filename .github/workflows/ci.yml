name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v5

      - name: Sync UV
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest -v

      - name: Run llama-mcp-install dry-run
        run: uv run llama-mcp-install --dry-run

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y python312 uv \
              py312-pydantic py312-pydantic-core py312-cryptography \
              py312-rpds-py py312-pyyaml py312-cffi py312-pytest \
              py312-requests py312-rich py312-pathspec py312-anyio \
              py312-httpx py312-jsonschema py312-starlette py312-uvicorn \
              py312-platformdirs py312-python-dotenv
          run: |
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            uv venv --python python3.12 --system-site-packages
            uv pip install hatchling editables
            uv pip install --no-build-isolation --no-deps -e .
            uv pip install --no-deps fastmcp fastmcp-slim mcp mcp-types \
              pydantic-settings docstring-parser cyclopts py-key-value-aio \
              uncalled-for openapi-pydantic jsonref jsonschema-path pathable \
              referencing jsonschema-specifications rich-rst mdurl \
              markdown-it-py pygments beartype cachetools typing-inspection \
              annotated-types typing-extensions exceptiongroup h11 \
              httpcore2 httpx2 idna certifi charset-normalizer urllib3 \
              click python-multipart sse-starlette websockets \
              opentelemetry-api pyjwt joserfc email-validator dnspython
            .venv/bin/python -m pytest -v
            .venv/bin/llama-mcp-install --dry-run
            .venv/bin/llama-mcp-install --install-service --dry-run
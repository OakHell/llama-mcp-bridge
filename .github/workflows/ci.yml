name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v5

      - name: Sync UV
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest -v

      - name: Run llama-mcp-install dry-run
        run: uv run llama-mcp-install --dry-run

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          cache-after-prepare: true
          # Note: cache-after-prepare keys on the VM image and prepare script text rather than pyproject.toml;
          # clear the FreeBSD Actions cache (or bump a comment here) when adding new dependencies.
          prepare: |
            pkg install -y python312 uv rust \
              py312-pydantic2 py312-pydantic-core py312-cryptography \
              py312-rpds-py py312-pyyaml py312-cffi py312-pytest \
              py312-requests py312-rich py312-pathspec py312-anyio \
              py312-httpx py312-jsonschema py312-starlette py312-uvicorn \
              py312-platformdirs py312-python-dotenv
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            uv pip install --system --break-system-packages -e .
          run: |
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            pytest -v
            llama-mcp-install --dry-run
            llama-mcp-install --install-service --dry-run

[bridge]
schema_version = 1

# Workspace and model paths (POSIX: /home/user/.llama-mcp-bridge | Windows: C:\Users\user\.llama-mcp-bridge)
# workspace = /home/user/.llama-mcp-bridge
# models_dir = /home/user/.llama-mcp-bridge/models
# models_ini = /home/user/.llama-mcp-bridge/models.ini
# llama_server_bin = /home/user/.llama-mcp-bridge/bin/llama-server

host = 127.0.0.1
port = 8080
auto_spawn = true

# Memory residency profile: stingy | moderate | snappy
residency = moderate
# Optional overrides for llama-server --models-max (0 = auto from tier+residency) and --sleep-idle-seconds (-1 = auto)
models_max = 0
sleep_idle_seconds = -1

# Auto-retry text requests on 'digest' if a heavier preset hits OOM
fallback_on_oom = false
health_timeout_s = 60
request_timeout_s = 180
log_format = text

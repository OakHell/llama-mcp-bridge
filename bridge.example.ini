[server]
host = 127.0.0.1
port = 8080

[models]
models_ini = /path/to/models.ini

[bridge]
auto_spawn = True
# Memory residency profile: stingy | moderate | snappy
residency = moderate
# Auto-retry text requests on 'digest' if a heavier preset hits OOM
fallback_on_oom = false
health_timeout_s = 60
request_timeout_s = 180

[logging]
log_level = INFO
log_file = /path/to/llama-mcp-bridge.log

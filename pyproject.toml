[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "llama-mcp-bridge"
version = "0.12.0"
description = "Hardware-aware local LLM MCP bridge powered by llama.cpp router mode"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["fastmcp", "pathspec", "requests", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/OakHell/llama-mcp-bridge"
Repository = "https://github.com/OakHell/llama-mcp-bridge"
Issues = "https://github.com/OakHell/llama-mcp-bridge/issues"

[project.scripts]
llama-mcp-bridge = "llama_mcp_bridge.bridge:main"
llama-mcp-install = "llama_mcp_bridge.installer:main"
llama-mcp-ps = "llama_mcp_bridge.installer:ps_main"
llama-mcp-models = "llama_mcp_bridge.models_cli:main"
llama-mcp-config = "llama_mcp_bridge.config_cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-requests"]

[tool.hatch.build.targets.wheel]
packages = ["src/llama_mcp_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"skills/llama-mcp-setup/SKILL.md" = "llama_mcp_bridge/skills/llama-mcp-setup/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_server: opt-in integration test requiring a real llama-server binary (set LLAMA_SERVER_BIN)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
